<!DOCTYPE html>
<html lang="de">
<head>
<script>

// ═══════════════════════════════════════════════════════
// GITHUB PUBLIC ARTICLE LOADER
// ═══════════════════════════════════════════════════════
async function loadArticlesFromGitHub() {
  articles = [];
  try {
    const r = await fetch('/.netlify/functions/articles');
    if (!r.ok) throw new Error('Failed to load: ' + r.status);
    const data = await r.json();
    articles = data.articles || [];
    window._githubSha = data.sha;
    console.log('Loaded', articles.length, 'articles');
    return true;
  } catch(e) {
    console.error('Load error:', e);
    articles = [];
    return false;
  }
}

async function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('.cf-submit');
  btn.textContent = 'Wird gesendet…'; btn.disabled = true;
  try {
    const res = await fetch(form.action, {method:'POST', body:new FormData(form), headers:{Accept:'application/json'}});
    if (res.ok) { document.getElementById('cf-form-inner').style.display='none'; document.getElementById('cf-success').style.display='block'; }
    else { btn.textContent='Fehler – bitte erneut versuchen'; btn.disabled=false; }
  } catch(err) { btn.textContent='Fehler – bitte erneut versuchen'; btn.disabled=false; }
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function fmtDate(d) { if(!d)return''; try{return new Date(d).toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});}catch(e){return d;} }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
loadAndApplyCustomI18n();
loadCalEntries();
// Load articles from GitHub
loadArticlesFromGitHub().then(() => {
  loadSiteTexts();
  loadLinkedIn();
  renderCategoryDropdown();
  renderTopicList();
  renderBlog();
  setLang(currentLang);
});
// Init handled by GitHub loader above
</script>
</body>
</html>
